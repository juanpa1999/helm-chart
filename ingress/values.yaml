# k3s trae Traefik como ingress controller por defecto (IngressClass "traefik").
ingressClassName: traefik

# Host del Ingress. Vacío = acepta cualquier Host.
# Debe coincidir con REACT_APP_API_URL (../frontend) y con el origin CORS (NGROK en ../backend).
# En local (k3d) resuelve con /etc/hosts: 127.0.0.1 pablodevops.store
host: pablodevops.store

# /api/* -> backend. El backend no tiene prefijo /api en sus rutas (/auth, /admin, ...),
# así que un Middleware de Traefik (StripPrefix) quita /api antes de reenviar.
# El frontend debe apuntar a <origen>/api: REACT_APP_API_URL=http://pablodevops.store/api
backend:
  path: /api
  serviceName: back-service   # ../backend -> service.name
  servicePort: 8000
  stripPrefix: true

# /* -> frontend
frontend:
  path: /
  serviceName: front-service  # ../frontend -> service.name
  servicePort: 3000
