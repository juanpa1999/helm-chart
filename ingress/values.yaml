# k3s trae Traefik como ingress controller por defecto (IngressClass "traefik").
ingressClassName: traefik

# Host del Ingress. Vacío = acepta cualquier Host.
# Debe coincidir con REACT_APP_API_URL (../frontend) y con el origin CORS (NGROK en ../backend).
# En local (k3d) resuelve con /etc/hosts: 127.0.0.1 pablodevops.store
host: pablodevops.store

# /api/* -> backend. El backend no tiene prefijo /api en sus rutas (/auth, /admin, ...),
# así que un Middleware de Traefik (StripPrefix) quita /api antes de reenviar.
# El frontend debe apuntar a <origen>/api: REACT_APP_API_URL=http://pablodevops.store/api
backend:
  path: /api
  serviceName: back-service # ../backend -> service.name
  servicePort: 8000
  stripPrefix: true

# /* -> frontend
frontend:
  path: /
  serviceName: front-service # ../frontend -> service.name
  servicePort: 3000

# HTTPS con cert-manager + Let's Encrypt (HTTP-01). Requiere cert-manager instalado y el
# ClusterIssuer de ../cert-manager/cluster-issuers.yaml aplicado. Si se activa, cambia a
# https:// también REACT_APP_API_URL (../frontend) y NGROK (../backend).
tls:
  enabled: true
  # Secret donde cert-manager guarda el certificado (lo comparten los dos Ingress).
  secretName: pablodevops-store-tls
  # Se crea un Certificate explícito en vez de la anotación cert-manager.io/cluster-issuer:
  # con dos Ingress del mismo host, la anotación generaría dos Certificate para un Secret.
  issuer:
    # letsencrypt-prod = cert confiable por los navegadores. Para pruebas usa
    # letsencrypt-staging (cert no confiable, sin rate limits de producción).
    name: letsencrypt-prod
    kind: ClusterIssuer
  # Ingress extra en el entrypoint "web" (:80) que redirige todo a https (308).
  # El challenge HTTP-01 de cert-manager sigue funcionando: es un Ingress propio con una
  # regla más específica (/.well-known/acme-challenge/<token>), que Traefik prioriza.
  redirectHttps: true
