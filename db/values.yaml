# Los nombres por defecto son los mismos de st-db.yaml (AK8s-kubernetes-local-deployment),
# para que el backend (DB_HOST=db-service) y up.sh (statefulset/db-statefulset) sigan funcionando.
statefulsetName: db-statefulset

image:
  repository: jpcc141999/db1
  # Fija un tag real en cuanto exista; "latest" puede traer otra versión en cada redeploy.
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 5432

service:
  name: db-service
  type: ClusterIP
  port: 5432
  # Headless (clusterIP: None), como en st-db.yaml. Ojo: clusterIP es inmutable; si ya
  # existe un db-service con ClusterIP normal, hay que borrarlo antes del upgrade.
  headless: true

# Las credenciales viven dentro de la imagen db1; pg_isready no necesita password.
readinessProbe:
  enabled: true
  user: postgres
  database: postgres

# Activado = los datos sobreviven reinicios del pod (equivale a pvc_postgres.yml).
# El PVC se crea con helm.sh/resource-policy: keep, así que sobrevive a helm uninstall.
persistence:
  enabled: true
  claimName: ""                 # vacío = <statefulsetName>-data
  size: 1Gi
  storageClass: local-path      # default de k3s/k3d; vacío = storageClass por defecto del cluster
  mountPath: /var/lib/postgresql/data

resources: {}
