apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: db
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.headless }}
  # Headless: es el serviceName del StatefulSet; el DNS resuelve directo a la IP del pod.
  clusterIP: None
  {{- end }}
  selector:
    app: db
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
