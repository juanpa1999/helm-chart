apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.statefulsetName }}
  labels:
    app: db
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Service "gobernante" del StatefulSet (headless, ver service.yaml).
  serviceName: {{ .Values.service.name }}
  # Una sola instancia: sin replicación, el PVC es ReadWriteOnce.
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.readinessProbe.user | quote }}
                - -d
                - {{ .Values.readinessProbe.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          env:
            # initdb falla si el volumen trae lost+found en la raíz del mount.
            - name: PGDATA
              value: {{ .Values.persistence.mountPath }}/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "db.pvcName" . }}
      {{- end }}
