# Ya no hay hook wait-for-secrets (era para bloquear `terraform apply`): ArgoCD
# trae health check para ExternalSecret, así que la Application app-secrets
# solo queda Healthy cuando ESO creó los Secrets, y la sync-wave de root
# no avanza a db/backend/frontend hasta entonces.
#
# Campos con default del CRD declarados explícitamente para evitar drift en ArgoCD.

# db-secret: el valor de Key Vault va tal cual (texto plano, sin base64) a DB_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.db.secretName }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: {{ .Values.db.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.db.secretKey }}
      remoteRef:
        key: {{ .Values.db.keyVaultSecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# docker-registry-secret (kubernetes.io/dockerconfigjson). Solo el token viene de
# Key Vault. El printf de Helm arma el template de ESO: los %s se reemplazan ahora
# con server/username, los %%s quedan como %s para el printf que corre ESO, y
# `.token` lo rellena ESO. Resultado:
#   {"auths":{"<server>":{"username":"u","password":"<token>","auth":"base64(u:<token>)"}}}
{{- with .Values.dockerRegistry }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $.Values.secretStore.name }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"{{ .token }}","auth":"{{ printf "%%s:%%s" "%s" .token | b64enc }}"}}}` .server .username .username | squote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .keyVaultSecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
