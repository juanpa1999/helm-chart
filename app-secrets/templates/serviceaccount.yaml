# ServiceAccount federado con la identidad de ESO (external_secrets.tf en
# terraform/azure/application). Ningún pod corre con él y no guarda credenciales:
# ESO pide un token para este SA y Entra ID lo cambia por un token de acceso al
# Key Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations:
    azure.workload.identity/client-id: {{ required "global.azure.esoClientId es obligatorio" .Values.global.azure.esoClientId | quote }}
