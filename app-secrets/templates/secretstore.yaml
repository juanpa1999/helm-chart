# SecretStore namespaced (no ClusterSecretStore): solo los ExternalSecret de este
# namespace pueden usar la identidad de ESO.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      environmentType: PublicCloud
      tenantId: {{ required "global.azure.tenantId es obligatorio" .Values.global.azure.tenantId | quote }}
      vaultUrl: {{ required "global.azure.keyVaultUrl es obligatorio" .Values.global.azure.keyVaultUrl | quote }}
      serviceAccountRef:
        name: {{ .Values.serviceAccount.name }}
