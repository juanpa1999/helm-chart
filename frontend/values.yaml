# Los nombres por defecto son los mismos de dp-front.yaml (el backend referencia front-service).
deploymentName: front-deploy

replicaCount: 1

image:
  repository: jpcc141999/front4
  # Fija un tag real en cuanto exista; "latest" puede traer otra versión en cada redeploy.
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 3000

# Pull secret (kubernetes.io/dockerconfigjson) para la imagen privada de Docker Hub.
# No lo crea este chart: lo genera External Secrets Operator desde Key Vault
# (vault-secrets-deployment/terraform/external-secret-docker-token.yaml) y debe
# existir en el mismo namespace. [] = sin pull secret (imagen pública).
imagePullSecrets:
- name: docker-registry-secret

# ClusterIP: el acceso externo es por el Ingress (../ingress). Para exponerlo directo
# sin Ingress: type: NodePort y nodePort: 32000.
service:
  name: front-service
  type: ClusterIP
  port: 3000
  nodePort: "" # solo aplica con type: NodePort; vacío = Kubernetes asigna uno

# La imagen trae REACT_APP_API_URL=http://pablodevops.store:8000 en su .env; la variable de
# entorno tiene prioridad (react-scripts start la lee al arrancar).
# Debe ser <esquema>://<host del Ingress> + backend.path de ../ingress. https porque el
# Ingress tiene TLS (cert-manager): con http el navegador bloquea las llamadas (mixed content).
extraEnv:
- name: REACT_APP_API_URL
  value: https://pablodevops.store/api

readinessProbe:
  enabled: true # tcpSocket

# Medido en k3d: ~475-505Mi estable. Es alto porque la imagen corre `npm start`
# (servidor de desarrollo de React con webpack), no un build estático; al arrancar
# compila todo y usa bastante CPU. Con una imagen de producción (build + nginx)
# bastaría con ~32Mi / 50m.
#   memoria > limit -> OOMKilled; CPU > limit -> throttling (solo arranca más lento).
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
