# Los nombres por defecto son los mismos de dp-front.yaml (el backend referencia front-service).
deploymentName: front-deploy

replicaCount: 1

image:
  repository: jpcc141999/front4
  # Fija un tag real en cuanto exista; "latest" puede traer otra versión en cada redeploy.
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 3000

# ClusterIP: el acceso externo es por el Ingress (../ingress). Para exponerlo directo
# sin Ingress: type: NodePort y nodePort: 32000.
service:
  name: front-service
  type: ClusterIP
  port: 3000
  nodePort: ""   # solo aplica con type: NodePort; vacío = Kubernetes asigna uno

# La imagen trae REACT_APP_API_URL=http://localhost:8000 en su .env; la variable de
# entorno tiene prioridad (react-scripts start la lee al arrancar).
# Debe ser <host del Ingress> + backend.path de ../ingress.
extraEnv:
  - name: REACT_APP_API_URL
    value: http://pablodevops.store/api

readinessProbe:
  enabled: true   # tcpSocket

resources: {}
