# Los nombres por defecto son los mismos de dp-back.yaml; el label app=back lo usa up.sh.
deploymentName: back-deployment

replicaCount: 1

image:
  repository: jpcc141999/back3
  # Fija un tag real en cuanto exista; "latest" puede traer otra versión en cada redeploy.
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

# ClusterIP: el acceso externo es por el Ingress (../ingress, path /api). Para exponerlo
# directo sin Ingress: type: NodePort y nodePort: 32001.
service:
  name: back-service
  type: ClusterIP
  port: 8000
  nodePort: "" # solo aplica con type: NodePort; vacío = Kubernetes asigna uno

# Nombre del Service de ../db. Se usa como DB_HOST y para esperar a que la DB responda.
# No está linkeado automáticamente con el chart db: si cambias service.name allá, cámbialo acá.
db:
  host: db-service
  port: 5432
  # DB_PASSWORD sale de un Secret que NO crea este chart: lo genera External Secrets
  # Operator desde Key Vault (vault-secrets-deployment/terraform/external-secret-db.yaml).
  # Debe existir en el mismo namespace antes de instalar, o el pod y el Job de migración
  # quedan en CreateContainerConfigError.
  passwordSecret:
    name: db-secret
    key: DB_PASSWORD

# Variables extra del contenedor (se aplican también al Job de migración).
# NGROK es el origin extra que main.py agrega a la lista de CORS: debe ser el origin
# del frontend tal como lo ve el navegador (esquema + host, sin "/" final).
# https porque el Ingress tiene TLS: el origin cambia de esquema y CORS lo compara exacto.
extraEnv:
- name: NGROK
  value: https://pablodevops.store

# Imagen usada solo para correr pg_isready antes de arrancar/migrar.
waitForDb:
  enabled: true
  image: postgres:16-alpine
  # Solo corre pg_isready en un loop: casi no consume.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi

# Cómo correr `alembic upgrade head`:
#   job            -> Job como hook de Helm post-install/post-upgrade (recomendado).
#                     Con ArgoCD se traduce a un hook PostSync.
#   initContainer  -> initContainer del Deployment; migra antes de cada arranque de pod.
#                     Solo seguro con replicaCount: 1 (varias réplicas migrarían en paralelo).
#   none           -> no migra; hazlo a mano:
#                     kubectl exec deploy/back-deployment -- alembic upgrade head
migrations:
  mode: job
  command: [ "alembic", "upgrade", "head" ]
  backoffLimit: 3
  activeDeadlineSeconds: 200
  # Misma imagen que el backend corriendo alembic (corto, pero carga SQLAlchemy y los modelos).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

readinessProbe:
  enabled: false # tcpSocket: no conocemos un endpoint /health real en la imagen back3

# Medido en k3d (Prometheus, container_memory_working_set_bytes): ~125Mi estable.
# requests = lo que el scheduler reserva en el nodo; limits = techo duro.
#   memoria > limit -> el kernel mata el contenedor (OOMKilled) y se reinicia.
#   CPU > limit     -> no lo mata, lo frena (throttling): responde más lento.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
